name: Build

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build and attach the artifacts to (for example v0.1.0)"
        required: false
        default: ""
        type: string
  workflow_call:
    inputs:
      tag:
        description: "Release tag to build and attach the artifacts to"
        required: false
        default: ""
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Build
        run: |
          npm ci && npm run dist

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            release/voiceverb-Setup.exe
            release/voiceverb-Portable.exe
          if-no-files-found: error

      - name: Attach artifacts to the release
        if: ${{ inputs.tag != '' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          files=("release/voiceverb-Setup.exe" "release/voiceverb-Portable.exe")
          existing=()
          for file in "${files[@]}"; do
            if [ -e "$file" ]; then existing+=("$file"); fi
          done
          if [ ${#existing[@]} -eq 0 ]; then
            echo "No build artifacts found for $TAG" >&2
            exit 1
          fi
          gh release upload "$TAG" "${existing[@]}" --clobber
