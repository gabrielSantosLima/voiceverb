name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Run checks
        run: |
          npm ci
          npm run check

  build:
    name: Build
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          npm ci && npm run dist
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            release/voiceverb-Setup.exe
            release/voiceverb-Portable.exe
          if-no-files-found: error

